[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "con-bot"
version = "2.4.0"
description = "Personal Telegram game commander powered by Meta Muse Spark"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "httpx>=0.27,<0.29",
  "pydantic>=2.8,<3",
  "python-telegram-bot>=21,<23",
  "python-dotenv>=1,<2",
  "websocket-client>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
con-bot = "sww3bot.telegram_bot:main"
con-agent = "sww3bot.agent_cli:main"

[tool.setuptools.packages.find]
include = ["sww3bot*", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
